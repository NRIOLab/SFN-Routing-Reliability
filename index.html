<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>SFN Routing Reliability Console</title>
</head>
<body>
<style>
/* Layout: two tabs in work order — (1) network input: nodes, arcs, paths; (2) analysis: control rail + decision summary + linked panels. Stacks to one column on phones. */
:root{
  --bg:#edf0f3; --panel:#ffffff; --ink:#16202b; --muted:#5a6675; --line:#d4dae1; --soft:#f5f7f9;
  --accent:#0d6b86; --accent-ink:#ffffff; --warn:#b5401f;
  --ok:#2f8a57; --pol:#d4861a; --nt:#c4523a; --af:#7b8794;
  --heat0:#f2f5f8; --heat1:#0b4f66;
  --font-display:"Times New Roman",Times,"Noto Serif TC","PMingLiU",serif;
  --font-body:"Times New Roman",Times,"Noto Serif TC","PMingLiU",serif;
  --font-data:"Times New Roman",Times,"Noto Serif TC","PMingLiU",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141a; --panel:#171e26; --ink:#e3e8ee; --muted:#93a0ae; --line:#2b3540; --soft:#1d252f;
  --accent:#4cb3cf; --accent-ink:#0b1217; --warn:#f08a6a;
  --ok:#55b77e; --pol:#e9a53f; --nt:#e2765d; --af:#8794a2;
  --heat0:#1b232c; --heat1:#5fc4de; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141a; --panel:#171e26; --ink:#e3e8ee; --muted:#93a0ae; --line:#2b3540; --soft:#1d252f;
  --accent:#4cb3cf; --accent-ink:#0b1217; --warn:#f08a6a;
  --ok:#55b77e; --pol:#e9a53f; --nt:#e2765d; --af:#8794a2;
  --heat0:#1b232c; --heat1:#5fc4de; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45}
i.v{font-style:italic;text-transform:none;letter-spacing:0}
.legend i.v,.kpi i.v{display:inline;width:auto;height:auto;margin:0;border:0;border-radius:0;background:none;vertical-align:baseline}
sub.v{font-size:72%;line-height:0;vertical-align:-0.28em;text-transform:none;letter-spacing:0}
.wrap{max-width:1360px;margin:0 auto;padding-inline:16px;padding-block:18px 40px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(24px,3vw,32px);letter-spacing:.01em;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;max-width:75ch}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{font:600 13px var(--font-body);background:var(--panel);color:var(--muted);border:0;padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs{margin-bottom:16px}
.tabs button{font-size:14px;padding:9px 18px}
.grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.rail{display:grid;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:900px){.rail{position:static}}
.box,.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.box h2,.panel h2{font-family:var(--font-display);font-weight:600;font-size:17px;margin:0 0 10px;letter-spacing:.01em}
.eyebrow{font:600 11px var(--font-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
label.fld{display:grid;gap:4px;margin-bottom:10px;font-size:13px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.row input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.val{font:500 15px var(--font-data);color:var(--ink);min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums}
select,input[type=number],input[type=text],textarea{font:14px var(--font-body);color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:6px 8px;width:100%;min-width:0}
textarea{font-family:var(--font-data);font-size:12px;min-height:120px;resize:vertical}
input.mono{font-family:var(--font-data);font-size:13px}
input.bad{border-color:var(--warn);background:color-mix(in oklab,var(--warn) 8%,var(--soft))}
.range2{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.btn{font:600 14px var(--font-body);border-radius:8px;padding:8px 12px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{font-size:12.5px;padding:4px 9px}
.btn.icon{padding:3px 8px;font-size:13px;line-height:1.2}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.status{font:12px var(--font-data);color:var(--muted);margin-top:8px}
.note{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.main{display:grid;gap:16px;min-width:0}
.summary{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:10px;padding:16px 18px;display:grid;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi .n{font:500 26px var(--font-data);font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .s{font-size:12px;color:var(--muted)}
.chip{display:inline-block;font:600 12px var(--font-body);padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.chip.good{color:var(--ok)} .chip.bad{color:var(--nt)} .chip.info{color:var(--muted)}
.advice{margin:0;padding-left:18px;display:grid;gap:6px;max-width:95ch}
.advice b{font-weight:600}
.panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:1100px){.panels{grid-template-columns:minmax(0,1fr)}}
.panel .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.panel p.cap{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.chart{width:100%;overflow-x:auto}
svg{display:block;width:100%;height:auto}
svg text{fill:var(--muted);font-family:var(--font-data);font-size:11px}
svg .lbl{fill:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.cell{cursor:pointer}
.cell:hover{stroke:var(--ink);stroke-width:1}
table.tr{width:100%;border-collapse:collapse;font-size:13px}
table.tr th,table.tr td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.tr td.num{font-family:var(--font-data);font-variant-numeric:tabular-nums;text-align:right}
table.tr th{font-weight:600;color:var(--muted);font-size:12px}
.pdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.inspect-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.inspect-ctl input{width:9em}
.steps{margin:8px 0 0;padding-left:18px;font-size:13px;display:grid;gap:3px}
.out{font-weight:600}
.pollist{display:grid;gap:6px}
.polrow{display:grid;grid-template-columns:auto auto 1fr auto auto;gap:8px;align-items:center;font-size:14px;padding:4px 6px;border:1px solid var(--line);border-radius:7px;background:var(--soft)}
.polrow.off{opacity:.55}
.polrow .rank{font:500 12px var(--font-data);color:var(--muted);min-width:1.6em}
.in-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1100px){.in-grid{grid-template-columns:minmax(0,1fr)}}
.edit td{padding:4px 4px}
.edit input,.edit select{padding:5px 6px;font-size:13px}
.edit .w-id{width:5.5em}.edit .w-node{width:6.5em}.edit .w-lead{width:5em}
.msgs{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--warn);display:grid;gap:2px}
.msgs.ok{color:var(--ok)}
.flag{font-size:12.5px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--soft);margin-top:8px}
footer{color:var(--muted);font-size:12.5px;margin-top:18px;max-width:110ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" data-t="eyebrow"></div>
      <h1 data-t="title"></h1>
      <p class="sub" data-t="subtitle"></p>
    </div>
    <div class="seg" role="group" aria-label="Language">
      <button id="lang-en" aria-pressed="true">EN</button>
      <button id="lang-zh" aria-pressed="false">中文</button>
    </div>
  </header>

  <div class="seg tabs" role="tablist">
    <button role="tab" id="tab-in" aria-selected="false" data-t="tabIn"></button>
    <button role="tab" id="tab-an" aria-selected="true" data-t="tabAn"></button>
  </div>

  <!-- ===================== NETWORK INPUT ===================== -->
  <section id="view-in" hidden>
        <section class="box" style="margin-bottom:16px">
          <h2 data-t="diagHd"></h2>
          <div class="chart" id="diagram"></div>
          <div class="legend" id="diag-leg"></div>
          <div class="flag" id="disjoint-flag"></div>
        </section>
    <div class="in-grid">
      <div class="main">
        <section class="box">
          <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap">
            <h2 data-t="pathsHd"></h2><button class="btn ghost sm" id="add-path" data-t="addPath"></button>
          </div>
          <p class="note" data-t="pathsNote" style="margin:0 0 8px"></p>
          <div class="chart"><table class="tr edit" id="path-table"></table></div>
        </section>
        <section class="box">
          <h2 data-t="arcsHd"></h2>
          <p class="note" data-t="arcsNote" style="margin:0 0 8px"></p>
          <div class="chart"><table class="tr edit" id="arc-table"></table></div>
        </section>
      </div>
      <div class="main">
        <section class="box">
          <h2 data-t="applyHd"></h2>
          <div class="btns">
            <button class="btn" id="apply" data-t="apply"></button>
            <button class="btn ghost" id="load-lin" data-t="loadLin"></button>
          </div>
          <ul class="msgs" id="msgs"></ul>
        </section>
        <section class="box">
          <h2 data-t="jsonHd"></h2>
          <p class="note" data-t="jsonNote" style="margin:0 0 8px"></p>
          <textarea id="json" spellcheck="false" aria-label="JSON"></textarea>
          <div class="btns" style="margin-top:8px">
            <button class="btn ghost sm" id="json-export" data-t="jsonExport"></button>
            <button class="btn ghost sm" id="json-copy" data-t="jsonCopy"></button>
            <button class="btn ghost sm" id="json-import" data-t="jsonImport"></button>
          </div>
        </section>
      </div>
    </div>
  </section>

  <!-- ===================== ANALYSIS ===================== -->
  <section id="view-an">
    <div class="grid">
      <aside class="rail">
        <section class="box">
          <h2 data-t="commitHd"></h2>
          <label class="fld"><span data-t="demand"></span>
            <span class="row"><input type="range" id="in-d" min="6" max="30" value="20"><span class="val" id="v-d"></span></span></label>
          <label class="fld"><span data-t="deadline"></span>
            <span class="row"><input type="range" id="in-T" min="6" max="20" value="15"><span class="val" id="v-T"></span></span></label>
          <label class="fld"><span data-t="target"></span>
            <span class="row"><input type="range" id="in-tg" min="0.50" max="0.99" step="0.01" value="0.80"><span class="val" id="v-tg"></span></span></label>
          <div class="eyebrow" data-t="rangeHd" style="margin:4px 0 6px"></div>
          <div class="range2">
            <span>d</span><span class="row"><input type="number" id="r-d0" min="1"><span>–</span><input type="number" id="r-d1" min="1"></span>
            <span>T</span><span class="row"><input type="number" id="r-T0" min="1"><span>–</span><input type="number" id="r-T1" min="1"></span>
          </div>
        </section>
        <section class="box">
          <h2 data-t="policyHd"></h2>
          <label class="fld"><span data-t="ruleHd"></span><select id="in-rule"></select></label>
          <p class="note" data-t="ruleNote" style="margin-bottom:8px"></p>
          <div class="pollist" id="pollist"></div>
          <p class="note" data-t="policyNote"></p>
          <div class="btns" style="margin-top:8px">
            <button class="btn ghost sm" id="btn-best" data-t="useBest"></button>
            <button class="btn ghost sm" id="btn-lin" data-t="useLin"></button>
          </div>
        </section>
        <section class="box">
          <h2 data-t="simHd"></h2>
          <label class="fld"><span data-t="trials"></span>
            <select id="in-N"><option value="10000">10,000</option><option value="50000">50,000</option><option value="100000" selected>100,000</option></select></label>
          <label class="fld"><span data-t="seed"></span><input type="number" id="in-seed" value="2026" min="1" step="1"></label>
          <button class="btn" id="btn-run" data-t="rerun"></button>
          <div class="status" id="status"></div>
        </section>
      </aside>

      <main class="main">
        <section class="summary" aria-live="polite">
          <div class="kpis">
            <div class="kpi"><div class="eyebrow" data-t="kRel"></div><div class="n" id="k-rel"></div><div class="s" id="k-ci"></div></div>
            <div class="kpi"><div class="eyebrow" data-t="kExact"></div><div class="n" id="k-ex"></div><div class="s" id="k-err"></div></div>
            <div class="kpi"><div class="eyebrow" data-t="kTarget"></div><div class="n" id="k-tg"></div><div class="s" id="k-tgs"></div></div>
            <div class="kpi"><div class="eyebrow" data-t="kRt"></div><div class="n" id="k-rt"></div><div class="s" id="k-rts"></div></div>
          </div>
          <div>
            <div class="eyebrow" data-t="advHd" style="margin-bottom:6px"></div>
            <ul class="advice" id="advice"></ul>
          </div>
        </section>

        <div class="panels">
          <section class="panel">
            <div class="hd"><h2 data-t="mapHd"></h2><span class="eyebrow" id="map-pol"></span></div>
            <p class="cap" data-t="mapCap"></p>
            <div class="chart" id="map"></div>
            <div class="legend" id="map-leg"></div>
          </section>
          <section class="panel">
            <div class="hd"><h2 data-t="decHd"></h2><span class="eyebrow" id="dec-d"></span></div>
            <p class="cap" data-t="decCap"></p>
            <div class="chart" id="dec"></div>
            <div class="legend" id="dec-leg"></div>
          </section>
          <section class="panel">
            <div class="hd"><h2 data-t="rtHd"></h2><span class="eyebrow" id="rt-d"></span></div>
            <p class="cap" data-t="rtCap"></p>
            <div class="chart" id="rt"></div>
            <div class="legend" id="rt-leg"></div>
          </section>
          <section class="panel">
            <div class="hd"><h2 data-t="frHd"></h2><span class="eyebrow" id="fr-tg"></span></div>
            <p class="cap" data-t="frCap"></p>
            <div class="chart" id="fr"></div>
            <div class="legend" id="fr-leg"></div>
          </section>
          <section class="panel">
            <div class="hd"><h2 data-t="bmHd"></h2><span class="eyebrow" id="bm-n"></span></div>
            <p class="cap" data-t="bmCap"></p>
            <div class="chart" id="bm"></div>
            <div class="legend" id="bm-leg"></div>
            <p class="note" id="bm-note"></p>
          </section>
          <section class="panel">
            <div class="hd"><h2 data-t="arcHd"></h2><span class="eyebrow" id="arc-sc"></span></div>
            <p class="cap" data-t="arcCap"></p>
            <div class="chart" id="arc"></div>
            <div class="legend" id="arc-leg"></div>
          </section>
          <section class="panel">
            <div class="hd"><h2 data-t="polHd"></h2><span class="eyebrow" id="pol-sc"></span></div>
            <p class="cap" id="pol-cap"></p>
            <div class="chart" id="pol"></div>
          </section>
          <section class="panel">
            <div class="hd"><h2 data-t="rulesHd"></h2><span class="eyebrow" id="rules-sc"></span></div>
            <p class="cap" data-t="rulesCap"></p>
            <div class="chart" id="rules"></div>
            <div class="legend" id="rules-leg"></div>
          </section>
        </div>

        <section class="panel">
          <div class="hd"><h2 data-t="insHd"></h2></div>
          <p class="cap" data-t="insCap"></p>
          <div class="inspect-ctl">
            <label for="in-k" class="eyebrow" data-t="trialNo"></label>
            <input type="number" id="in-k" min="1" value="1">
            <button class="btn ghost sm" id="k-prev" aria-label="previous">‹</button>
            <button class="btn ghost sm" id="k-next" aria-label="next">›</button>
            <button class="btn ghost sm" id="k-fail" data-t="nextFail"></button>
          </div>
          <div class="chart"><table class="tr" id="ins-table"></table></div>
          <ol class="steps" id="ins-steps"></ol>
        </section>
      </main>
    </div>
  </section>

  <footer id="footer"></footer>
</div>

<script>
(function(){
"use strict";
// ======================= Default network: Lin (2009), Table 1 =======================
const LIN={
 paths:[{id:"P1",arcs:"a1, a2, a3"},{id:"P2",arcs:"a5, a6, a7"},{id:"P3",arcs:"a9, a10, a11"}],
 arcs:[
  {id:"a1",lead:2,dist:"5:0.85, 3:0.05, 1:0.05, 0:0.05"},
  {id:"a2",lead:1,dist:"5:0.80, 3:0.10, 1:0.05, 0:0.05"},
  {id:"a3",lead:3,dist:"4:0.85, 2:0.05, 1:0.05, 0:0.05"},
  {id:"a5",lead:2,dist:"5:0.85, 3:0.05, 1:0.05, 0:0.05"},
  {id:"a6",lead:2,dist:"6:0.80, 4:0.05, 2:0.05, 1:0.05, 0:0.05"},
  {id:"a7",lead:3,dist:"4:0.85, 2:0.05, 1:0.05, 0:0.05"},
  {id:"a9",lead:2,dist:"5:0.60, 3:0.20, 2:0.10, 1:0.05, 0:0.05"},
  {id:"a10",lead:2,dist:"7:0.65, 5:0.10, 4:0.10, 2:0.05, 1:0.05, 0:0.05"},
  {id:"a11",lead:1,dist:"6:0.70, 4:0.10, 2:0.10, 1:0.05, 0:0.05"}],
 range:{d0:6,d1:30,T0:6,T1:20}};
const PALETTE=["#2f67c8","#0c8a78","#8457c2","#c0662a","#b0387a","#4f7d1f","#9a7b12","#2b8bb0","#7a4b2a","#5560c4"];
const OUT=["ok","pol","nt","af"]; const OCOL=["var(--ok)","var(--pol)","var(--nt)","var(--af)"];

// ======================= Strings =======================
const S={
en:{eyebrow:"Agent-based Monte Carlo · stochastic-flow network",title:"SFN Routing Reliability Console",
subtitle:"Enter the minimal paths and each arc's lead time and capacity distribution (the network diagram is generated from the paths), then choose a delivery commitment and a routing policy. ArcAgents sample capacities, PathAgents compute transmission times and the RouterAgent applies the policy; every panel is built from the same trial log.",
tabIn:"1  Network input",tabAn:"2  Analysis",
nodesHd:"Nodes",nodesLbl:"Node names, separated by commas",source:"Source s",sink:"Sink t",
arcsHd:"Arc data",arcsNote:"Every arc named in the paths appears here automatically. Enter its lead time and capacity distribution as capacity:probability pairs, e.g. 5:0.85, 3:0.05, 1:0.05, 0:0.05. Capacities are non-negative integers and probabilities must sum to 1. An arc used by several paths is the same physical arc.",
thId:"Arc",thFrom:"Inferred from",thTo:"to",thLead:"Lead time",thDist:"Capacity distribution",thMax:"Max",thSum:"Σp",
pathsHd:"Minimal paths",addPath:"+ Add path",pathsNote:"List the arcs of each path in order from the source s to the sink t, e.g. a1, a2, a3. The nodes and the network diagram are built from these paths, and the routing policy chooses among them.",
thPath:"Path",thArcs:"Arcs in order",thPL:"Lead",
diagHd:"Network diagram (generated from the paths)",applyHd:"Apply",apply:"Apply and run simulation",loadLin:"Load Lin (2009) example",
jsonHd:"Save or share the input",jsonNote:"Export the current input as JSON to keep a copy, or paste JSON and load it.",jsonExport:"Export to box",jsonCopy:"Copy",jsonImport:"Load from box",copied:"Copied",copyFail:"Select the text and copy it manually",
disjYes:"Paths are arc-disjoint: exact values from the closed form (Eq. 7) are shown for validation.",
disjNo:(pairs)=>`Paths share arcs (${pairs}): the closed form (Eq. 7) does not hold, so only simulation estimates are shown.`,
okApplied:(n,m)=>`Applied: ${n} arcs, ${m} paths. Simulation updated.`,
err:{nodes:"Enter at least two distinct node names.",srcSnk:"Source and sink must be different nodes.",arcId:(r)=>`Arc row ${r}: enter a unique arc name.`,arcEnds:(a)=>`Arc ${a}: choose different 'from' and 'to' nodes.`,

function parseDist(s){const parts=String(s).split(",").map(x=>x.trim()).filter(Boolean);const out=[];
  for(const p of parts){const m=p.match(/^(-?\d+(?:\.\d+)?)\s*:\s*(\d*\.?\d+(?:e-?\d+)?)$/i);if(!m)return null;out.push([+m[1],+m[2]])}return out.length?out:null}
const splitArcs=s=>String(s||"").split(/[,\s→>]+/).map(x=>x.trim()).filter(Boolean);
// Build the network from the paths: consecutive arcs share a node, the first arc leaves s, the last arc enters t.
function infer(raw){

  const mk=x=>{if(!(x in par))par[x]=x}; const un=(a,b)=>{mk(a);mk(b);par[f(a)]=f(b)};
  mk("S");mk("T"); const P=raw.paths.map(p=>({id:String(p.id||"").trim(),arcs:splitArcs(p.arcs)}));
  const order=[]; P.forEach(p=>p.arcs.forEach(a=>{if(!order.includes(a))order.push(a)}));
  order.forEach(a=>{mk("t:"+a);mk("h:"+a)});
  P.forEach(p=>{if(!p.arcs.length)return;un("t:"+p.arcs[0],"S");un("h:"+p.arcs[p.arcs.length-1],"T");for(let k=1;k<p.arcs.length;k++)un("h:"+p.arcs[k-1],"t:"+p.arcs[k])});

  const nc=mx+2, maxRows=Math.max(...Object.values(cols).map(c=>c.length));
  const W=Math.max(520,nc*150), H=Math.max(180,maxRows*90+40), pos={};
  Object.entries(cols).forEach(([c,list])=>list.forEach((n,i)=>{pos[n]={x:40+(+c)*(W-80)/Math.max(1,nc-1),y:(i+1)*H/(list.length+1)}}));
  const s=svg(W,H,host); s.style.maxWidth=W*1.25+"px"; s.style.margin="0 auto";
  const defs=el("defs",{},s); const mk=el("marker",{id:"arw",viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"9",markerHeight:"9",markerUnits:"userSpaceOnUse",orient:"auto-start-reverse"},defs); el("path",{d:"M0,0 L10,5 L0,10 z",style:"fill:var(--muted)"},mk);
  const pathsOf={}; I.P.forEach((p,j)=>p.arcs.forEach(a=>{(pathsOf[a]=pathsOf[a]||[]).push(j)}));
  const lead=id=>{const a=RAW.arcs.find(x=>x.id===id);return a&&a.lead!==""?a.lead:"?"};
  const pairCount={};
  edges.forEach(a=>{const A=pos[a.from],B=pos[a.to]; if(!A||!B)return;
    const key=[a.from,a.to].sort().join("|"); const n=(pairCount[key]=(pairCount[key]||0)+1);
    const dx=B.x-A.x,dy=B.y-A.y,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len,r1=a.from==="s"?15:7,r2=a.to==="t"?15:7;
    const x1=A.x+ux*r1,y1=A.y+uy*r1,x2=B.x-ux*r2,y2=B.y-uy*r2, off=(n-1)*22*(n%2?1:-1), cx=(x1+x2)/2-uy*off, cy=(y1+y2)/2+ux*off;
    const ps=pathsOf[a.id]||[], col=ps.length>1?"var(--ink)":pcol(ps[0]||0);
    el("path",{d:`M${x1},${y1} Q${cx},${cy} ${x2},${y2}`,style:`fill:none;stroke:${col};stroke-width:${ps.length>1?3:2.2}`,"marker-end":"url(#arw)"},s);
    el("text",{x:cx+uy*13,y:cy-ux*13+3,"text-anchor":"middle",class:"lbl"},s,`${a.id} (${lead(a.id)})`)});
  nodes.forEach(n=>{const p=pos[n],end=n==="s"||n==="t";el("circle",{cx:p.x,cy:p.y,r:end?14:6,style:`fill:${end?"var(--panel)":"var(--ink)"};stroke:${end?"var(--accent)":"var(--ink)"};stroke-width:${end?2.5:1}`},s);if(end)el("text",{x:p.x,y:p.y+4,"text-anchor":"middle",class:"lbl",style:"font-size:13px;font-style:italic"},s,n)});
  const anyShared=Object.values(pathsOf).some(v=>v.length>1);
  $("diag-leg").innerHTML=I.P.map((p,j)=>`<span><i style="background:${pcol(j)}"></i>${esc(p.id)}</span>`).join("")+(anyShared?`<span><i style="background:var(--ink)"></i>${L==="zh"?"共用弧":"shared arc"}</span>`:"")+`<span>(${t("thLead")})</span>`;
  const c=compile(RAW); $("disjoint-flag").textContent=c.net?(c.net.disjoint?t("disjYes"):S[L].disjNo(c.net.shared.join(", "))):"";
}
function showMsgs(list,ok){const u=$("msgs");u.className="msgs"+(ok?" ok":"");u.innerHTML=list.map(x=>`<li>${esc(x)}</li>`).join("")}
function cleanRaw(){const used=new Set(RAW.paths.flatMap(p=>splitArcs(p.arcs)));return{paths:RAW.paths.map(p=>({id:p.id,arcs:p.arcs})),arcs:RAW.arcs.filter(a=>used.has(a.id))}}
function applyNet(){
  const c=compile(RAW); if(c.errs){showMsgs(c.errs,false);return false}
  NET=c.net; const cr=cleanRaw(); isLin=JSON.stringify(cr.arcs)===JSON.stringify(LIN.arcs)&&JSON.stringify(cr.paths)===JSON.stringify(LIN.paths);
  try{localStorage.setItem("sfn-net-v3",JSON.stringify(cr))}catch(e){}
  runSim(+$("in-N").value,Math.max(1,+$("in-seed").value||2026));
  setPolicy(linRule(state.d,state.T)); state.k=1; setStatus(); renderAll();
  $("footer").textContent=S[L].footer(isLin);
  showMsgs([S[L].okApplied(NET.arcs.length,NET.paths.length)],true); return true;
}

// ======================= Controls =======================
function syncInputs(){const R=state.range;
  $("in-d").min=R.d0;$("in-d").max=R.d1;$("in-T").min=R.T0;$("in-T").max=R.T1;
  state.d=Math.min(Math.max(state.d,R.d0),R.d1);state.T=Math.min(Math.max(state.T,R.T0),R.T1);
  $("in-d").value=state.d;$("in-T").value=state.T;$("in-tg").value=state.tg;$("v-d").textContent=state.d;$("v-T").textContent=state.T;$("v-tg").textContent=state.tg.toFixed(2);
  $("r-d0").value=R.d0;$("r-d1").value=R.d1;$("r-T0").value=R.T0;$("r-T1").value=R.T1}
function readRange(){const v=["r-d0","r-d1","r-T0","r-T1"].map(id=>Math.round(+$(id).value));let[d0,d1,T0,T1]=v;
  if(!(d0>=1&&d1>=d0&&T0>=1&&T1>=T0)){syncInputs();return} d1=Math.min(d1,d0+79);T1=Math.min(T1,T0+59);state.range={d0,d1,T0,T1};syncInputs();renderAll()}
function setStatus(){if(SIM)$("status").textContent=`N = ${SIM.N.toLocaleString()} · seed ${SIM.seed} · ${SIM.ms.toFixed(0)} ms`}
function applyLang(){document.documentElement.lang=L==="zh"?"zh-Hant":"en";document.querySelectorAll("[data-t]").forEach(e=>{e.textContent=t(e.dataset.t)});
  $("lang-en").setAttribute("aria-pressed",L==="en");$("lang-zh").setAttribute("aria-pressed",L==="zh");
  $("footer").textContent=S[L].footer(isLin); syncInputs(); setStatus(); drawInputs(); renderAll()}
function showTab(which){const inV=which==="in";$("view-in").hidden=!inV;$("view-an").hidden=inV;$("tab-in").setAttribute("aria-selected",inV);$("tab-an").setAttribute("aria-selected",!inV);
  try{localStorage.setItem("sfn-tab",which)}catch(e){} if(inV)drawDiagram()}
$("tab-in").addEventListener("click",()=>showTab("in"));
$("tab-an").addEventListener("click",()=>showTab("an"));
$("in-d").addEventListener("input",e=>{state.d=+e.target.value;syncInputs();renderAll()});
$("in-T").addEventListener("input",e=>{state.T=+e.target.value;syncInputs();renderAll()});
$("in-tg").addEventListener("input",e=>{state.tg=+e.target.value;syncInputs();renderAll()});
["r-d0","r-d1","r-T0","r-T1"].forEach(id=>$(id).addEventListener("change",readRange));
$("btn-best").addEventListener("click",()=>{setPolicy(polRows().rows[0].pol);renderAll()});
$("in-rule").addEventListener("change",e=>{state.rule=e.target.value;renderAll()});
$("btn-lin").addEventListener("click",()=>{setPolicy(linRule(state.d,state.T));renderAll()});
$("btn-run").addEventListener("click",()=>{$("btn-run").disabled=true;$("status").textContent="…";setTimeout(()=>{runSim(+$("in-N").value,Math.max(1,+$("in-seed").value||2026));setStatus();$("btn-run").disabled=false;renderAll()},20)});
$("in-k").addEventListener("change",e=>{state.k=+e.target.value||1;drawInspector()});
$("k-prev").addEventListener("click",()=>{state.k--;drawInspector()});
$("k-next").addEventListener("click",()=>{state.k++;drawInspector()});
$("k-fail").addEventListener("click",()=>{for(let s=1;s<=SIM.N;s++){const k=(state.k-1+s)%SIM.N;if(outcome(trialB(k),state.pol,state.d,state.T)!==0){state.k=k+1;break}}drawInspector()});
$("add-path").addEventListener("click",()=>{let k=RAW.paths.length+1;while(RAW.paths.some(p=>p.id==="P"+k))k++;RAW.paths.push({id:"P"+k,arcs:""});drawInputs();setTimeout(()=>{const i=$("pa-"+(RAW.paths.length-1));if(i)i.focus()},0)});
$("apply").addEventListener("click",()=>{if(applyNet())showTab("an")});
$("load-lin").addEventListener("click",()=>{RAW=JSON.parse(JSON.stringify(LIN));state.range={...LIN.range};state.d=20;state.T=15;drawInputs();syncInputs();applyNet()});
$("json-export").addEventListener("click",()=>{$("json").value=JSON.stringify({...cleanRaw(),range:state.range},null,1)});
$("json-copy").addEventListener("click",async e=>{const b=e.currentTarget;if(!$("json").value)$("json-export").click();try{await navigator.clipboard.writeText($("json").value);b.textContent=t("copied");setTimeout(()=>b.textContent=t("jsonCopy"),1500)}catch(err){$("json").select();showMsgs([t("copyFail")],false)}});
$("json-import").addEventListener("click",()=>{try{const j=JSON.parse($("json").value);if(!Array.isArray(j.arcs)||!Array.isArray(j.paths))throw 0;
  RAW={paths:j.paths.map(p=>({id:String(p.id),arcs:Array.isArray(p.arcs)?p.arcs.join(", "):String(p.arcs)})),arcs:j.arcs.map(a=>({id:String(a.id),lead:a.lead,dist:Array.isArray(a.dist)?a.dist.map(x=>x.join(":")).join(", "):String(a.dist)}))};
  if(j.range)state.range={...state.range,...j.range}; drawInputs(); syncInputs(); applyNet()}catch(err){showMsgs([S[L].err.json],false)}});
$("lang-en").addEventListener("click",()=>{L="en";try{localStorage.setItem("lang",L)}catch(e){}applyLang()});
$("lang-zh").addEventListener("click",()=>{L="zh";try{localStorage.setItem("lang",L)}catch(e){}applyLang()});

// ======================= Typesetting: italic symbols with subscripts (P1 → P₁, a10 → a₁₀) =======================
const ID_RE=/\b([A-Za-z]{1,2})(\d{1,3})\b/g, VAR_RE=/(^|[^A-Za-z])([dTNbwR])(?=\s*(?:[=≥≤<>,)(（]|$))/g;
function fmtTextNode(n){const s=n.nodeValue; if(!/[A-Za-z]/.test(s))return;
  const parts=[];let last=0;const re=new RegExp(ID_RE.source+"|"+VAR_RE.source,"g");let m;
  while((m=re.exec(s))){ if(m[1]!==undefined){parts.push([s.slice(last,m.index)],["id",m[1],m[2]]);last=m.index+m[0].length}
    else{const pre=m[3]||"";parts.push([s.slice(last,m.index)+pre],["var",m[4]]);last=m.index+m[0].length}}
  if(!parts.length)return; parts.push([s.slice(last)]);
  const f=document.createDocumentFragment();
  for(const q of parts){if(q.length===1){if(q[0])f.appendChild(document.createTextNode(q[0]));continue}
    const i=document.createElement("i");i.className="v";i.textContent=q[1];f.appendChild(i);
    if(q[0]==="id"){const b=document.createElement("sub");b.className="v";b.textContent=q[2];f.appendChild(b)}}
  n.parentNode.replaceChild(f,n);
}
const SVGNS="http://www.w3.org/2000/svg";
function fmtSvgText(tx){if(tx.dataset.fmt)return;const s=tx.textContent;tx.dataset.fmt="1";
  const re=new RegExp(ID_RE.source+"|"+VAR_RE.source,"g");if(!re.test(s))return;re.lastIndex=0;
  while(tx.firstChild)tx.removeChild(tx.firstChild);let last=0,m;
  const add=(txt,it,sub)=>{if(!txt)return;const sp=document.createElementNS(SVGNS,"tspan");if(it)sp.setAttribute("font-style","italic");if(sub){sp.setAttribute("baseline-shift","sub");sp.setAttribute("font-size","75%")}sp.textContent=txt;tx.appendChild(sp)};
  while((m=re.exec(s))){if(m[1]!==undefined){add(s.slice(last,m.index));add(m[1],true);add(m[2],false,true)}else{add(s.slice(last,m.index)+(m[3]||""));add(m[4],true)}last=m.index+m[0].length}
  add(s.slice(last));
}
function fmtAll(root){
  root.querySelectorAll("svg text").forEach(fmtSvgText);
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){const p=n.parentElement;if(!p)return 2;
    if(p.closest("script,style,textarea,select,option,svg,title,i.v,sub.v,.status"))return 2;return 1}});
  const list=[];while(w.nextNode())list.push(w.currentNode);list.forEach(fmtTextNode);
}
let fmtBusy=false,fmtQueued=false;
const obs=new MutationObserver(()=>{if(fmtBusy||fmtQueued)return;fmtQueued=true;requestAnimationFrame(()=>{fmtQueued=false;fmtBusy=true;obs.disconnect();fmtAll(document.body);obs.observe(document.body,{childList:true,subtree:true,characterData:true});fmtBusy=false})});
obs.observe(document.body,{childList:true,subtree:true,characterData:true});

// ======================= Boot =======================
try{const s=localStorage.getItem("lang");if(s==="zh"||s==="en")L=s}catch(e){}
try{const s=JSON.parse(localStorage.getItem("sfn-net-v3")||"null");if(s&&Array.isArray(s.arcs)&&Array.isArray(s.paths)&&compile(s).net)RAW=s}catch(e){}
let tab="an";try{const s=localStorage.getItem("sfn-tab");if(s==="in"||s==="an")tab=s}catch(e){}
drawInputs(); syncInputs();
if(!applyNet()){RAW=JSON.parse(JSON.stringify(LIN));drawInputs();applyNet()}
$("msgs").innerHTML="";
applyLang(); showTab(tab);
})();
</script>
